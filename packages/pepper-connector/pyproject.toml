[project]
name = "pepper-connector"
version = "2.4.2"
description = "Pepper (pepper.ru) MCP connector — community deals read in the plugin Chrome tab"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dmitry Avdonkin" }]
dependencies = [
    # Pinned, not floating: the name `mcp-core` on PyPI belongs to an
    # unrelated project. Unpinned, a wheel installed straight from a GitHub
    # Release resolves to that stranger's package and the server dies on
    # import. A pin turns a silent wrong install into a loud resolve failure.
"mcp-core==2.4.2",
    "fastmcp>=3.4.6,<4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "playwright>=1.40",
]

[project.scripts]
pepper-mcp = "pepper_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepper_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
