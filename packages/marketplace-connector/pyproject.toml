[project]
name = "marketplace-connector"
version = "2.4.2"
description = "MCP-сервер плагина ru-shop-search: search, card, shops поверх коннекторов магазинов"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir-Human", email = "39053957+Vladimir-Human@users.noreply.github.com" }]
# Коннекторы — жёсткие зависимости: compare импортирует каждый защищённо,
# и сломанная установка стоит одного магазина, а не сервера.
dependencies = [
    # Pinned, not floating: the name `mcp-core` on PyPI belongs to an
    # unrelated project. Unpinned, a wheel installed straight from a GitHub
    # Release resolves to that stranger's package and the server dies on
    # import. A pin turns a silent wrong install into a loud resolve failure.
"mcp-core==2.4.2",
    "fastmcp>=3.4.6,<4",
    "pydantic>=2.6",
    "wb-connector",
    "ozon-connector",
    "yandex-connector",
    "detmir-connector",
    "avito-connector",
    "lamoda-connector",
    "dns-connector",
    "citilink-connector",
    "mvideo-connector",
    "vseinstrumenti-connector",
    "regard-connector",
    "nix-connector",
    "aliexpress-connector",
    "compare-connector",
]

[project.scripts]
marketplace-mcp = "marketplace_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
wb-connector = { workspace = true }
ozon-connector = { workspace = true }
yandex-connector = { workspace = true }
detmir-connector = { workspace = true }
avito-connector = { workspace = true }
lamoda-connector = { workspace = true }
dns-connector = { workspace = true }
citilink-connector = { workspace = true }
mvideo-connector = { workspace = true }
vseinstrumenti-connector = { workspace = true }
regard-connector = { workspace = true }
nix-connector = { workspace = true }
aliexpress-connector = { workspace = true }
compare-connector = { workspace = true }
